name: Watch for limusic releases

# GitHub runs update.yml's schedule hours late, and on some repositories never
# runs it at all. So this workflow polls upstream itself for most of the 6-hour
# job limit and starts update.yml within a minute of a release, then starts the
# next watch. The schedule below only restarts the chain after a failure.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/watch.yml
      - scripts/watch.py
  schedule:
    - cron: '43 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: limusic-bin-aur-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Start update.yml when a limusic release is ready
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/watch.py --minutes 340

      - name: Start the next watch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A watch already waiting behind this one (schedule or push) takes over.
          waiting=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow watch.yml --limit 20 \
            --json databaseId,status --jq "[.[] | select(.status != \"completed\" and .databaseId != $GITHUB_RUN_ID)] | length")
          if [ "$waiting" -eq 0 ]; then
            gh workflow run watch.yml --repo "$GITHUB_REPOSITORY" --ref main
          fi
