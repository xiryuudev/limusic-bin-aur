name: Update and publish AUR package

# Checks upstream SimoHypers/limusic for a new stable release, rebuilds
# PKGBUILD/.SRCINFO, validates them with a real makepkg build plus namcap, and
# only then pushes to the AUR. Any problem stops the run before the AUR is
# touched.
#
# watch.yml is what actually keeps this timely: it polls upstream and starts
# this workflow within a minute of a release. The schedule below is only a
# fallback, because GitHub fires cron hours late (and on some repositories not
# at all).

on:
  push:
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and publish even when the package is current
        type: boolean
        default: false

permissions:
  contents: read

# One update at a time: concurrent pushes would race on the AUR.
concurrency:
  group: limusic-bin-aur-maintenance
  cancel-in-progress: false

env:
  AUR_PKGNAME: limusic-bin
  UPSTREAM_REPO: SimoHypers/limusic

jobs:
  # ---------------------------------------------------------------------------
  # 1. Cheap check on the runner (no container).
  # ---------------------------------------------------------------------------
  check:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      update_needed: ${{ steps.check.outputs.update_needed }}
      version: ${{ steps.check.outputs.version }}
      release_tag: ${{ steps.check.outputs.release_tag }}
      deb_url: ${{ steps.check.outputs.deb_url }}
      deb_api_digest: ${{ steps.check.outputs.deb_api_digest }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Compare upstream latest with PKGBUILD and AUR
        id: check
        run: ./scripts/check-update.sh
        env:
          # Unauthenticated GitHub API is 60 requests/hour per IP and shared
          # runner IPs exhaust it; the token lifts this to 1000/hour.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # 2. Build + validate + publish, inside a real Arch container.
  # ---------------------------------------------------------------------------
  publish:
    needs: check
    # Explicit status check allows packaging on a push even though check skipped.
    #
    # The state commit this workflow pushes back to main is itself a push, so a
    # push-triggered run ignores it: otherwise every publish would immediately
    # rebuild the same package in a fresh 45-minute container.
    if: >-
      !cancelled() &&
      !(github.event_name == 'push' && contains(github.event.head_commit.message, 'chore: sync PKGBUILD')) &&
      (
        github.event_name == 'push' ||
        (needs.check.result == 'success' &&
         (needs.check.outputs.update_needed == 'true' || inputs.force == true))
      )
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
      push_reason: ${{ steps.publish.outputs.push_reason }}
      commit_sha: ${{ steps.publish.outputs.commit_sha }}
    defaults:
      run:
        shell: bash
    steps:
      # The archlinux:base-devel image ships neither git nor ssh, and
      # actions/checkout needs git before setup can run. A full sysupgrade is
      # required: `pacman -Sy <pkg>` alone is the partial-upgrade pattern Arch
      # forbids and can install a git built for a newer glibc than the image.
      - name: Bootstrap git and ssh
        run: pacman -Syu --noconfirm --needed git openssh >/dev/null

      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up clean Arch container
        run: bash scripts/ci-setup.sh

      - name: Render PKGBUILD, build, run namcap
        run: >-
          ./scripts/as-builder.sh ./scripts/ci-build.sh
          "${VERSION}" "${DEB_URL}"
        env:
          SRC_DIR: ${{ github.workspace }}
          EXPECTED_DIGEST: ${{ needs.check.outputs.deb_api_digest }}
          VERSION: ${{ needs.check.outputs.version }}
          DEB_URL: ${{ needs.check.outputs.deb_url }}

      - name: Show resulting PKGBUILD
        run: |
          sed -n '1,40p' PKGBUILD
          echo '--- .SRCINFO ---'
          sed -n '1,40p' .SRCINFO

      # The AUR is only written once build + namcap + verification have passed.
      - name: Publish to AUR
        id: publish
        run: ./scripts/publish.sh "${VERSION}"
        env:
          # Empty on a push-triggered run; publish.sh then reads the PKGBUILD.
          VERSION: ${{ needs.check.outputs.version }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
          AUR_EMAIL: ${{ secrets.AUR_EMAIL }}
          WORKDIR: ${{ runner.temp }}/aur-publish

      - name: Commit new state to this repository
        if: steps.publish.outputs.published == 'true' || steps.publish.outputs.push_reason == 'AUR already up to date'
        run: ./scripts/commit-state.sh "${VERSION}" "${{ steps.publish.outputs.commit_sha }}"
        env:
          VERSION: ${{ needs.check.outputs.version }}
          WORKDIR: ${{ runner.temp }}/aur-state
          TARGET_BRANCH: main

  # ---------------------------------------------------------------------------
  # 3. Keep a single issue open while the automation is broken. Nothing is
  #    pushed to the AUR on a failed run, so this is the only signal.
  # ---------------------------------------------------------------------------
  notify-failure:
    needs: [check, publish]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update a failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERSION: ${{ needs.check.outputs.version }}
          REASON: ${{ needs.check.outputs.reason }}
          PUBLISHED: ${{ needs.publish.outputs.published }}
          PUSH_REASON: ${{ needs.publish.outputs.push_reason }}
        run: |
          set -euo pipefail
          title='limusic-bin automation failed'
          api="https://api.github.com/repos/${REPO}"

          # Say what really happened: a failure after a successful AUR push (for
          # example the mirror commit) must not claim the AUR was left untouched.
          if [ "${PUBLISHED:-}" = "true" ]; then
            aur_note="The AUR **was** updated before this failure — the remaining problem is in a later step (see the run log)."
          elif [ -n "${PUSH_REASON:-}" ]; then
            aur_note="The AUR was not changed (publish outcome: ${PUSH_REASON})."
          else
            aur_note="The AUR was **not** modified by this run."
          fi

          existing="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api}/issues?state=open&labels=automation&per_page=100" \
            | jq -r --arg t "$title" '[.[] | select(.title == $t)] | first | .number // empty')"

          body="$(printf 'Workflow run failed: %s\n\n- upstream version: `%s`\n- check reason: %s\n- publish outcome: %s\n\n%s\n' \
            "$RUN_URL" "${VERSION:-unknown}" "${REASON:-unknown}" "${PUSH_REASON:-n/a}" "$aur_note")"

          if [ -n "$existing" ]; then
            curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${api}/issues/${existing}/comments" \
              -d "$(jq -n --arg b "$body" '{body:$b}')" >/dev/null
            echo "commented on issue #${existing}"
          else
            curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${api}/issues" \
              -d "$(jq -n --arg t "$title" --arg b "$body" \
                    '{title:$t, body:$b, labels:["automation"]}')" >/dev/null
            echo "opened issue: ${title}"
          fi
