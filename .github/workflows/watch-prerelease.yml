name: Watch for limusic prereleases

# GitHub runs schedule triggers hours late, and on some repositories never runs
# them at all. This workflow polls upstream itself for most of the 6-hour job
# limit and starts update-prerelease.yml within about a minute of a release,
# then starts the next watch. The schedule only restarts the chain after a
# failure.
#
# Lives on main because GitHub runs `schedule` only on the default branch, and
# checks out the prerelease branch for scripts/watch-prerelease.py.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/watch-prerelease.yml
      - scripts/watch-prerelease.py
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: limusic-bin-prerelease-watch
  cancel-in-progress: false

env:
  PACKAGE_BRANCH: prerelease

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PACKAGE_BRANCH }}

      - name: Start update-prerelease.yml when a release is ready
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/watch-prerelease.py --minutes 340

      - name: Start the next watch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A watch already waiting behind this one (schedule or push) takes over.
          waiting=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow watch-prerelease.yml --limit 20 \
            --json databaseId,status --jq "[.[] | select(.status != \"completed\" and .databaseId != $GITHUB_RUN_ID)] | length")
          if [ "$waiting" -eq 0 ]; then
            gh workflow run watch-prerelease.yml --repo "$GITHUB_REPOSITORY" --ref main
          fi
