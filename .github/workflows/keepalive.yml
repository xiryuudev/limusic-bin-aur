name: keepalive

# GitHub disables scheduled workflows in a repository that shows no activity for
# 60 days. A quiet upstream could therefore silently stop the update checks.
# This workflow writes a heartbeat file once a month so the schedule stays alive.
#
# Delete this file if you would rather not have the extra monthly commit.

on:
  schedule:
    - cron: '17 3 1 * *'   # 1st of each month, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: limusic-bin-aur-keepalive
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Touch heartbeat
        run: |
          set -euo pipefail
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/heartbeat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/heartbeat
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m 'chore: keepalive heartbeat'
          git push
